name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff==0.17.2

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/house-prices
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=training --cov=serving --cov-report=term-missing

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/house-prices/serving/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race ./...

  test-agent:
    name: Agent Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/rag-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

  test-web:
    name: Web Lint & Build
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-python, test-go, test-agent, test-web]
    defaults:
      run:
        working-directory: services/house-prices
    steps:
      - uses: actions/checkout@v4

      - name: Build model API image
        run: docker build -t house-prices-api:${{ github.sha }} .

      - name: Build Go proxy image
        run: docker build -f Dockerfile.go -t house-prices-proxy:${{ github.sha }} .

      - name: Build agent image
        working-directory: .
        run: docker build -f services/rag-agent/Dockerfile -t rag-agent:${{ github.sha }} .

      - name: Build web image
        working-directory: web
        run: docker build -t mlops-web:${{ github.sha }} .
