name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/house-prices
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=training --cov=serving --cov-report=term-missing

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/house-prices/serving/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race ./...

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-python, test-go]
    defaults:
      run:
        working-directory: services/house-prices
    steps:
      - uses: actions/checkout@v4

      - name: Build model API image
        run: docker build -t house-prices-api:${{ github.sha }} .

      - name: Build Go proxy image
        run: docker build -f Dockerfile.go -t house-prices-proxy:${{ github.sha }} .
