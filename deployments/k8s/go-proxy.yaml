apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-proxy
  namespace: house-prices
  labels:
    app: go-proxy
    app.kubernetes.io/part-of: mlops-engineering
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-proxy
  template:
    metadata:
      labels:
        app: go-proxy
    spec:
      containers:
        - name: go-proxy
          image: house-prices-proxy:latest
          args:
            - "-backend"
            - "http://model-api.house-prices.svc.cluster.local:8000"
            - "-port"
            - "8080"
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: go-proxy
  namespace: house-prices
  labels:
    app: go-proxy
spec:
  selector:
    app: go-proxy
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer
