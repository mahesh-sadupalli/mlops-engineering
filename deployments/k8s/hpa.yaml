apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-api
  namespace: house-prices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-proxy
  namespace: house-prices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-proxy
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
